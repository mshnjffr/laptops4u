<div class="laptop-list-container">
  <div class="header">
    <h1>Available Laptops</h1>
    <p>Choose from our selection of premium laptops</p>
    <div class="laptop-count" *ngIf="!loading && !error && laptops.length > 0">
      <span>{{ laptops.length }} laptop{{ laptops.length !== 1 ? 's' : '' }} available</span>
    </div>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading laptops...</p>
  </div>

  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="loadLaptops()">Try Again</button>
  </div>

  <div *ngIf="!loading && !error" class="laptops-grid">
    <app-laptop-card 
      *ngFor="let laptop of laptops; trackBy: trackByLaptopId" 
      [laptop]="laptop">
    </app-laptop-card>
  </div>

  <div *ngIf="!loading && !error && laptops.length === 0" class="no-laptops">
    <div class="empty-state">
      <h3>No laptops available</h3>
      <p>Check back later for new arrivals!</p>
      <button class="refresh-btn" (click)="loadLaptops()">Refresh</button>
    </div>
  </div>
</div>
